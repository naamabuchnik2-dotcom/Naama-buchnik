<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Management System</title>
    <!-- Include Tailwind CSS CDN -->
    <link href="https://cdn.tailwindcss.com/3.2.4/css/tailwind.min.css" rel="stylesheet">
    <!-- Custom CSS for styles -->
    <style>
        body {
            background-color: #f8fafc;
            color: #1e293b;
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }
        .bg-blue-500 {
            background-color: #2563eb !important;
        }
        /* Add more styles as needed */
    </style>
</head>
<body>

<!-- Navigation Bar -->
<nav class="bg-blue-500 shadow-md py-4">
    <div class="container mx-auto flex justify-between items-center">
        <a href="#" class="text-white text-xl font-bold">Course Management System</a>
        <!-- Add navigation links as needed -->
    </div>
</nav>

<!-- Main Content Area -->
<div class="container mx-auto mt-10 p-4">
    <!-- Example of a card component -->
    <div class="bg-white rounded-lg shadow-md mb-6">
        <div class="p-4">
            <h2 class="text-xl font-bold text-blue-500">Courses</h2>
            <!-- Add course list here -->
        </div>
    </div>

    <!-- Example of a form component -->
    <form class="max-w-md mx-auto p-6 shadow-md bg-white rounded-lg">
        <label for="courseName" class="block mb-2 text-sm font-medium text-gray-900">Course Name</label>
        <input type="text" id="courseName" name="courseName" class="bg-gray-50 border border-gray-300 text-gray-900 sm:text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">
    </form>
</div>

<!-- Footer -->
<footer class="bg-blue-500 py-4 text-center text-white">
    <p>&copy; 2023 Course Management System</p>
</footer>

</body>
</html>
